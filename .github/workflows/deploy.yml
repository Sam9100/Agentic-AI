name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages:    write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout repository ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Inject API keys as config.js ──────────────────────────────────
      #       Dibuat dari GitHub Repository Secrets.
      #       Tambahkan secret: GROQ_API_KEY dan/atau GEMINI_API_KEY
      #       di Settings → Secrets and variables → Actions
      - name: Generate config.js from secret
        run: |
          cat > config.js << 'EOF'
          // Auto-generated by GitHub Actions — do not edit manually
          window.GROQ_API_KEY = '${{ secrets.GROQ_API_KEY }}';
          EOF

      # ── 3. Configure GitHub Pages ─────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # ── 4. Upload site artifact ───────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # ── 5. Deploy ─────────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
