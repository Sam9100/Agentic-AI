# ─────────────────────────────────────────────────────────────────────────────
#  ResearchMind — GitHub Actions: Deploy to GitHub Pages
#
#  Workflow ini:
#    1. Membuat config.js dari GitHub repository secret (GEMINI_API_KEY)
#    2. Men-deploy seluruh direktori ke GitHub Pages
#
#  Setup:
#    1. Masuk ke repository → Settings → Secrets and variables → Actions
#    2. Tambahkan secret baru:  Name = GEMINI_API_KEY, Value = kunci aslimu
#    3. Masuk ke Settings → Pages → Source → GitHub Actions
#    4. Push ke branch main untuk memulai deploy
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages:    write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout repository ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Inject API key as config.js ───────────────────────────────────
      #       The file is gitignored locally; GitHub Actions creates it here
      #       from the repository secret so it is included only in the build.
      - name: Generate config.js from secret
        run: |
          cat > config.js << 'EOF'
          // Auto-generated by GitHub Actions — do not edit manually
          window.GEMINI_API_KEY = '${{ secrets.GEMINI_API_KEY }}';
          EOF

      # ── 3. Configure GitHub Pages ─────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # ── 4. Upload site artifact ───────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # ── 5. Deploy ─────────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
